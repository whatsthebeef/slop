# Runs Claude on `@claude` mentions in PR and issue comments and in PR reviews, through the Claude GitHub App.
# Slop posts such comments itself (for example to resolve a merge conflict), and supers rely on them for fixes.
# From catalog/scripts/claude.yml. Needs the repo secret CLAUDE_CODE_OAUTH_TOKEN and the Claude GitHub App on the repo.
#
# Authentication: add a repo secret named CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). To use an API
# key instead, store it as ANTHROPIC_API_KEY and swap the `claude_code_oauth_token` input for `anthropic_api_key`.
#
# allowed_bots: slop's @claude comments come from slop's GitHub App, so their author is a bot (`<slug>[bot]`), and
# claude-code-action ignores bots that aren't listed in `allowed_bots`. Slop's App is `slop[bot]`; keep it
# listed below. List specific bots only, never "*".
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'slop[bot]'
