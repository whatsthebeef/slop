# Slop sub gate for slop's own repo (from catalog/scripts/sub-gate.yml): the repo's checks for
# subs, reported as the `sub-gate` check run. Slop applies the board's policy (size, sensitive
# paths) when this passes on the PR's head, then merges the sub or converts it to a same.
name: sub-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

# One gate run per PR: a newer push or the slop:sub label cancels the one in progress. Any other label gets a group of
# its own (its job is skipped), so it can't cancel a gate run that is under way.
concurrency:
  group: sub-gate-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'slop:sub' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  sub-gate:
    # A label other than slop:sub (an env or QA label) must not start a run: it would cancel the one in progress.
    if: ${{ !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'slop:sub') && (github.event.action != 'labeled' || github.event.label.name == 'slop:sub') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The server tests create throwaway databases next to this one.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: slop
          POSTGRES_PASSWORD: slop
          POSTGRES_DB: slop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U slop" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
