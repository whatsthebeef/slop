# CodeBuild buildspec that runs a board's acceptance tests (ATF) and reports the result to slop. slop
# doesn't start ATF: the board's pipeline does, as a stage after it deploys to a release or integration
# environment, or after a branch deploy. Pass SLOP_ENVIRONMENT (the environment tested) and SLOP_SHA (the
# commit it runs); for a run on a glob's branch, also SLOP_GLOB (the glob's ID).
#
# The tests themselves live in the repository's .sstor/atf.sh, which must write JUnit XML under
# reports/atf/. CodeBuild keeps those reports (the `reports` group below), and .sstor/atf-report.sh sends
# slop the counts and a link, whether the tests passed or not. Any failing test shows as an ATF failure on
# the glob's card; it never blocks a PR, approval, sign-off or a production deploy.
#
# Which specs run: .sstor/atf-specs.sh asks slop for the specs the globs merged in this deploy planned (their test
# plans), exports them as SLOP_ATF_SPECS (one path per line) and SLOP_ATF_GREP, and .sstor/atf.sh runs only those, or the
# board's default suite when the list is empty.
#
# Identity: no stored slop secret. The project's role asks AWS for a short-lived JWT (AWS outbound identity federation,
# STS GetWebIdentityToken) and slop checks it against the role ARN registered on the board as an "AWS IAM" ATF runner.
# The project needs only SLOP_URL and SLOP_BOARD (plus SLOP_ENVIRONMENT, SLOP_SHA); do NOT set SLOP_TOKEN, which would be
# used instead (the board's integration token, deprecated for ATF). The scripts then post results to slop over HTTP.
# If slop can't be reached or doesn't know the role, the default suite runs and nothing is reported; the pipeline never fails.
# One-time setup (README.md, "AWS IAM runner"): an account owner enables outbound identity federation and gives this
# project's role sts:GetWebIdentityToken; a server admin allows the account; a board admin registers the role.
# SLOP_OIDC_AUDIENCE overrides the token's audience when it isn't SLOP_URL.
#
# The scripts call `aws sts get-web-identity-token` and, if the CLI doesn't have that command (the CodeBuild image's CLI is
# older than the feature: check `aws sts get-web-identity-token help` in the image), a boto3 one-liner that needs a
# recent boto3. When neither works, install a current AWS CLI v2 in an install phase before the build phase (the AWS
# installer zip), or `pip install --upgrade boto3` for the boto3 route.
# The scripts need curl and python3, which the standard images have.
#
# To keep sending results over EventBridge instead (AWS only), set SLOP_ATF_TRANSPORT=eventbridge; the project's role then
# needs events:PutEvents on the default bus. A board that has slop start this project (push mode) gets the list in
# SLOP_ATF_SPECS already.
version: 0.2

phases:
  build:
    commands:
      - mkdir -p reports/atf
      # Sourced, so the exports reach the next command (all commands share one shell). Never fails the build.
      - '. .sstor/atf-specs.sh "$SLOP_ENVIRONMENT" reports/atf'
      - bash .sstor/atf.sh "$SLOP_ENVIRONMENT"
  post_build:
    commands:
      # Runs whatever the build result, so a failing run is reported too.
      - bash .sstor/atf-report.sh "$SLOP_ENVIRONMENT" reports/atf

reports:
  atf:
    files:
      - '**/*.xml'
    base-directory: reports/atf
    file-format: JUNITXML
