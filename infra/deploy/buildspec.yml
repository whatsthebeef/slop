# CodeBuild for slop-<stage>-host: every push to main is built as an arm64 image, pushed to ECR and
# deployed to the instance. Environment (from infra/lib/host-stack.ts): AWS_REGION, STAGE, INSTANCE_ID,
# REPOSITORY_URI, PUBLIC_URL, BACKUP_BUCKET.
# Lint, type check and tests are not re-run here: the `checks` workflow runs them on GitHub for every merge to
# main, and remote-deploy.sh health-checks the new release and rolls back if it doesn't come up.
# A failure at any step leaves the running release alone.
version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
  build:
    commands:
      - export IMAGE="${REPOSITORY_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - docker build -t "$IMAGE" -t "${REPOSITORY_URI}:latest" .
      - docker push "$IMAGE"
      - docker push "${REPOSITORY_URI}:latest"
  post_build:
    commands:
      # Only reached when the build above succeeded (a failed phase skips the rest of the build, not post_build),
      # so check it before deploying.
      - '[ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] || exit 1'
      - export IMAGE="${REPOSITORY_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - bash infra/deploy/deploy.sh
