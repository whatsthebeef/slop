# CodeBuild for slop-<stage>-host: every push to main is checked, built as an arm64 image, pushed to ECR and
# deployed to the instance. Environment (from infra/lib/host-stack.ts): AWS_REGION, STAGE, INSTANCE_ID, BUCKET,
# REPOSITORY_URI, PUBLIC_URL. A failure at any step leaves the running release alone.
version: 0.2
phases:
  pre_build:
    commands:
      # The checks run in a Node 24 container (the image's runtime), against a throwaway pgvector database.
      - docker run -d --name slop-pg -p 5432:5432 -e POSTGRES_USER=slop -e POSTGRES_PASSWORD=slop -e POSTGRES_DB=slop pgvector/pgvector:pg17
      - until docker exec slop-pg pg_isready -U slop -d slop; do sleep 2; done
      - docker run --rm --network host -v "$PWD":/work -w /work node:24-slim sh -c 'corepack enable && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test'
      - docker rm -f slop-pg
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
  build:
    commands:
      - export IMAGE="${REPOSITORY_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - docker build -t "$IMAGE" -t "${REPOSITORY_URI}:latest" .
      - docker push "$IMAGE"
      - docker push "${REPOSITORY_URI}:latest"
  post_build:
    commands:
      # Only reached when the build above succeeded (a failed phase skips the rest of the build, not post_build),
      # so check it before deploying.
      - '[ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] || exit 1'
      - export IMAGE="${REPOSITORY_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - bash infra/deploy/deploy.sh
